; /etc/php/8.4/fpm/pool.d/clickup-intake.conf
[clickup-intake]
user = clickupintake
group = clickupintake
listen = /run/php/php8.4-fpm-clickup-intake.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
; Task creation and forwarding call ClickUp/Graph synchronously (E10).
request_terminate_timeout = 300s
php_admin_value[max_execution_time] = 300
php_admin_value[open_basedir] = /var/www/clickup-intake/
php_admin_value[sys_temp_dir] = /var/www/clickup-intake/storage/tmp
php_admin_value[upload_tmp_dir] = /var/www/clickup-intake/storage/tmp
php_admin_value[session.save_path] = /var/www/clickup-intake/storage/tmp
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_flag[expose_php] = off
